url: https://mjfrigaard.github.io/msst2ap/

template:
  bootstrap: 5
  theme: arrow-light
  bslib:
    primary:   "#1E5F8C"   # Atomic Blue       — links, buttons, navbar
    secondary: "#2B2B2B"   # Eames Charcoal    — neutral text emphasis
    success:   "#7B8B47"   # Avocado / Olive   — retro success accent
    info:      "#4FA5B5"   # Robin's-Egg Blue  — softer secondary blue
    warning:   "#E87B2D"   # Atomic Tangerine  — primary orange accent
    danger:    "#B0411C"   # Burnt Sienna      — deep orange danger
    code-color: "#16486D"  # Deep Atomic Blue  — inline & block code text
    code-bg:    "#FDEFE0"  # Pale Tangerine    — inline & block code background
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono

reference:
- title: "Mastering Shiny Modules: dataset"
  desc: >
    Functions for dataset module
  contents:
  - datasetInput
  - datasetServer
- title: "Mastering Shiny Modules: datasetApp"
  desc: >
    Functions for dataset app
  contents:
  - datasetApp
- title: "Mastering Shiny Modules: selectVar"
  desc: >
    Functions for selectVar module
  contents:
  - selectVarInput
  - selectVarServer
- title: "Mastering Shiny Modules: selectVarApp"
  desc: >
    Functions for selectVarApp
  contents:
  - selectVarApp
- title: "Mastering Shiny Modules: selectDataVar"
  desc: >
    Functions for selectVar module
  contents:
  - selectDataVarUI
  - selectDataVarServer
  - DataVarUI
  - DataVarServer
- title: "Mastering Shiny Modules: selectDataVarApp"
  desc: >
    Functions for selectDataVarApp
  contents:
  - selectDataVarApp
  - selectDataVarApp2
- title: "Mastering Shiny Modules: histogram"
  desc: >
    Functions for histogram module
  contents:
  - histogramOutput
  - histogramServer
- title: "Mastering Shiny Modules: histogramApp"
  desc: >
    Functions for histogramApp
  contents:
  - histogramApp
- title: "Utilities"
  desc: "Helper functions"
  contents:
  - find_vars
  - not-in
  - test_cmt

